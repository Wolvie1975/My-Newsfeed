# Runs MyNewsFeed as its own container, independent of the dev container, next to the sql2025 container
# on the shared dev-bridge network. Start it with:   docker compose up -d --build
name: mynewsfeed

services:
  web:
    build: .
    image: mynewsfeed-web:latest
    container_name: mynewsfeed-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8085}:8080"
    environment:
      ConnectionStrings__DefaultConnection: ${SQL_CONNECTION:?Set SQL_CONNECTION in .env}
      Admin__Password: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      Display__TimeZone: ${DISPLAY_TIMEZONE:-UTC}
    volumes:
      - mynewsfeed-keys:/keys
    networks:
      - dev-bridge
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /healthz HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  dev-bridge:
    external: true

volumes:
  mynewsfeed-keys:
