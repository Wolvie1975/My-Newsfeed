<svg xmlns="http://www.w3.org/2000/svg" viewBox="11 7 43 50">
  <!-- The myNewspaper front-page mark as a one-colour shape for CSS masks: the type, photo and fold line are cut out, so
       the placeholder paints it in the colour scheme's placeholder ink. -->
  <defs>
    <mask id="cut">
      <path d="M12 8h29l11 11v37H12z" fill="#fff"/>
      <path d="M41 8v11h11" fill="none" stroke="#000" stroke-width="2.4"/>
      <g fill="#000"><rect x="16" y="12" width="21" height="5.5" rx="1"/><rect x="16" y="21" width="32" height="1.4"/><rect x="16" y="25.5" width="32" height="4.5" rx="1"/><rect x="16" y="33.5" width="15" height="12" rx="1" fill-opacity=".65"/><rect x="34" y="33.5" width="14" height="2.2" rx="1"/><rect x="34" y="38.3" width="14" height="2.2" rx="1"/><rect x="34" y="43.1" width="10" height="2.2" rx="1"/><rect x="16" y="48.5" width="32" height="2.2" rx="1"/></g>
    </mask>
  </defs>
  <rect x="11" y="7" width="43" height="50" fill="#000" mask="url(#cut)"/>
</svg>
